[project]
name = "checkparavola"
version = "0.1.0"
description = ""
authors = [{ name = "Theofilos Intzoglou", email = "int.teo@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pypdf2 (>=3.0.1,<4.0.0)", "termcolor (>=2.5.0,<3.0.0)"]

[project.scripts]
checkparavola = "checkparavola:main"

[tool.poetry.scripts]
checkparavola = "checkparavola:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
packages = [{ include = "checkparavola" }]
